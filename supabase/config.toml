project_id = "collaborative-studio-portfolio"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/auth/reset-password", "http://localhost:5173"]
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = true
double_confirm_changes = true

[storage]
file_size_limit = "5MiB"
